<!DOCTYPE html>
<html lang="zh-Hant-HK" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0d10">
<meta name="description" content="離線專業節拍器：拍號、Odd Time、細分、重拍、鼓聲及多種練習模式">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="節拍器">
<title>離線節拍器</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#0b0d10;--panel:#141920;--panel2:#1c232c;--line:#2a333e;--text:#f1f4f7;--muted:#8d9aa8;
--acc:#ff7a1a;--beat:#27c2b0;--soft:#3d6f69;--sub:#9a8cff;--good:#4ade80;--warn:#fbbf24;--bad:#f87171;--play:#22c55e;--stop:#ef4444;--r:14px}
[data-theme="night"]{--bg:#000;--panel:#0d0606;--panel2:#170909;--line:#2a1111;--text:#ff8a7a;--muted:#a3524a;--acc:#ff3b2f;--beat:#c2412f;--soft:#5a1d17;--sub:#a0362b;--play:#b91c1c;--stop:#7f1d1d}
[data-theme="light"]{--bg:#eef1f4;--panel:#fff;--panel2:#f2f4f7;--line:#d5dbe2;--text:#11161c;--muted:#5b6876;--acc:#e8590c;--beat:#0f9488;--soft:#9cc9c3;--sub:#6d5dfc}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"PingFang HK","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
body{padding-bottom:calc(96px + env(safe-area-inset-bottom));overscroll-behavior-y:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
.muted{color:var(--muted)}
.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{font-weight:700;font-size:18px}.brand small{color:var(--muted);font-weight:400;font-size:12px}
.logo{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--acc);color:#111;margin-right:4px}
.topbtns{display:flex;gap:6px;align-items:center}
.badge{font-size:12px;padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.badge.ok{color:var(--good);border-color:color-mix(in srgb,var(--good) 50%,transparent)}
.badge.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 50%,transparent)}
.ghost{background:transparent;border:1px solid var(--line);border-radius:10px;padding:6px 10px;min-height:36px}
main{max-width:760px;margin:0 auto;padding:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px}
details.card>summary{list-style:none;font-weight:700;font-size:17px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:center;min-height:32px}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"▾";color:var(--muted);transition:transform .15s}
details.card:not([open])>summary::after{transform:rotate(-90deg)}
.sumval{margin-left:auto;font-weight:400;font-size:13px;color:var(--muted);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60%}
.lbl{font-size:13px;color:var(--muted);margin:12px 0 6px}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0;min-height:1em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-height:42px;min-width:48px;font-variant-numeric:tabular-nums}
.chip.on{background:var(--acc);border-color:var(--acc);color:#111;font-weight:700}
.chip small{display:block;font-size:11px;opacity:.75;font-weight:400}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:10px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
label.chk{flex-direction:row;align-items:center;gap:10px;color:var(--text);font-size:15px;min-height:40px}
label.chk input{width:22px;height:22px;accent-color:var(--acc)}
input[type=text],input[type=number],select{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-height:42px;color:var(--text);width:100%}
select.big{font-size:17px;font-weight:600}
.inline{display:flex;gap:6px;align-items:center}.inline input,.inline select{width:auto;flex:1}
input[type=range]{width:100%;accent-color:var(--acc);height:36px}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:6px 0}
.seg button{flex:1;background:var(--panel2);border:0;padding:10px;min-height:44px}
.seg button.on{background:var(--acc);color:#111;font-weight:700}
/* stage */
.status{display:flex;justify-content:space-between;gap:8px;font-size:15px;color:var(--muted)}
.status b{color:var(--text);font-size:20px;font-variant-numeric:tabular-nums}
.modelabel{font-size:13px;color:var(--warn);min-height:18px;margin:4px 0}
.vistabs{display:flex;gap:6px;margin:4px 0 8px}
.vistabs button{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px;min-height:38px}
.vistabs button.on{border-color:var(--beat);color:var(--beat);font-weight:700}
.vis{min-height:150px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.bignum{display:flex;align-items:baseline;justify-content:center;gap:12px}
.bignum b{font-size:64px;line-height:1;font-variant-numeric:tabular-nums;transition:color .05s}
.bignum span{color:var(--muted);font-size:14px}
.lights{display:flex;flex-wrap:wrap;justify-content:center;gap:14px}
.grp{display:flex;gap:6px;padding:6px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
.light{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;font-weight:700;font-size:15px;transition:transform .06s,box-shadow .06s;padding:0}
.light.lv3{border-color:var(--acc);color:var(--acc)}.light.lv2{border-color:var(--beat);color:var(--beat)}
.light.lv1{border-color:var(--soft);color:var(--soft)}.light.lv0{border-style:dashed;color:var(--muted);opacity:.6}
.light.lit.lv3{background:var(--acc);color:#111;box-shadow:0 0 22px var(--acc);transform:scale(1.15)}
.light.lit.lv2{background:var(--beat);color:#111;box-shadow:0 0 18px var(--beat);transform:scale(1.1)}
.light.lit.lv1{background:var(--soft);color:#fff;transform:scale(1.06)}
.light.lit.lv0{background:var(--line);transform:scale(1.04)}
.stage.silent .light.lit{box-shadow:none;outline:2px dotted var(--muted);outline-offset:2px}
.grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.ggrp{display:flex;gap:3px;padding:4px;border-radius:10px;background:var(--panel2);border:1px solid var(--line)}
.gcell{position:relative;width:56px;height:52px;border-radius:7px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.gcell .gn{position:absolute;left:3px;top:1px;font-size:10px;color:var(--muted);pointer-events:none}
.mk{position:absolute;top:14px;bottom:4px;border-radius:4px;border:0;padding:0;background:var(--line);opacity:.9}
.mk.beat.lv3{background:var(--acc)}.mk.beat.lv2{background:var(--beat)}.mk.beat.lv1{background:var(--soft)}.mk.beat.lv0{background:transparent;border:1px dashed var(--muted)}
.mk.sub{background:var(--sub);opacity:.55;top:22px}.mk.sub.off{background:transparent;border:1px dashed var(--muted);opacity:.6}
.mk.lit{opacity:1;box-shadow:0 0 12px currentColor;filter:brightness(1.5);outline:2px solid var(--text)}
.gcell.cur{border-color:var(--text)}
.track{position:relative;height:70px;margin:0 6px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
.track .tk{position:absolute;top:10px;bottom:10px;width:3px;margin-left:-1.5px;border-radius:2px;background:var(--beat)}
.track .tk.lv3{background:var(--acc);top:4px;bottom:4px;width:5px;margin-left:-2.5px}.track .tk.lv1{background:var(--soft)}.track .tk.lv0{background:var(--line)}
.track .gs{position:absolute;top:0;bottom:0;width:1px;border-left:2px dashed var(--muted);opacity:.5}
.track .head{position:absolute;top:-4px;bottom:-4px;width:6px;margin-left:-3px;border-radius:3px;background:var(--text);box-shadow:0 0 14px var(--text)}
.pulse{width:90px;height:90px;border-radius:50%;margin:4px auto;background:var(--panel2);border:3px solid var(--line);transition:transform .08s}
.pulse.hit3{background:var(--acc);transform:scale(1.12)}.pulse.hit2{background:var(--beat);transform:scale(1.05)}.pulse.hit1{background:var(--soft)}
/* tempo */
.bpmrow{display:grid;grid-template-columns:46px 46px minmax(0,1fr) 46px 46px;gap:5px;align-items:center}
.bpmbtn{height:58px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-size:18px;font-weight:700;user-select:none;-webkit-user-select:none}
.bpmbtn:active{background:var(--line)}
.bpmbox{text-align:center}
#bpm{width:100%;min-width:0;font-size:clamp(46px,13.5vw,92px);letter-spacing:-1px;font-weight:800;text-align:center;background:transparent;border:0;padding:0;line-height:1;font-variant-numeric:tabular-nums;min-height:0;-moz-appearance:textfield}
#bpm::-webkit-inner-spin-button,#bpm::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.bpmunit{font-size:13px;color:var(--muted)}
/* accent row */
.accentrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.accentrow .grp{gap:5px}
.accbtn{width:46px;height:52px;border-radius:10px;border:2px solid var(--line);background:var(--panel2);font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;line-height:1.1}
.accbtn small{font-size:10px;font-weight:400}
.accbtn.lv3{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 30%,var(--panel2))}.accbtn.lv2{border-color:var(--beat)}
.accbtn.lv1{border-color:var(--soft);opacity:.85}.accbtn.lv0{border-style:dashed;opacity:.55}
.legend{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lv{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;border:2px solid var(--line);font-size:11px;color:var(--text)}
.lv.lv3{border-color:var(--acc)}.lv.lv2{border-color:var(--beat)}.lv.lv1{border-color:var(--soft)}.lv.lv0{border-style:dashed}
.maskrow{display:flex;flex-wrap:wrap;gap:6px}
.maskrow button{width:48px;height:44px;border-radius:9px;border:1px solid var(--line);background:var(--panel2)}
.maskrow button.on{background:var(--sub);color:#111;font-weight:700;border-color:var(--sub)}
.maskrow button.lock{background:var(--beat);color:#111;opacity:.8}
.rolerow{display:grid;grid-template-columns:88px 1fr 52px;gap:6px;align-items:center;margin-top:8px}
.rolerow span{font-size:14px}
.prev{height:42px;border-radius:10px;border:1px solid var(--line);background:var(--panel2)}
.volrow{display:grid;grid-template-columns:96px 1fr 44px;gap:8px;align-items:center;font-size:14px}
.volrow output{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:8px}
.seccard{border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:10px;background:var(--panel2)}
.seccard .fields{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.sechead{display:flex;gap:6px;align-items:center}.sechead input{flex:1;font-weight:700}
.secbtns{display:flex;gap:4px}.secbtns button{min-width:38px;min-height:38px;border-radius:8px;border:1px solid var(--line);background:var(--panel)}
.preview{font-size:13px;color:var(--good);margin-top:8px;word-break:break-word}
.preview.bad{color:var(--bad)}
.foot{text-align:center;color:var(--muted);font-size:12px;margin:18px 0}
.kbd{display:inline-block;border:1px solid var(--line);border-bottom-width:3px;border-radius:6px;padding:0 6px;font-size:12px;margin-right:4px}
/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:1fr 2fr 1fr;gap:8px;padding:10px 10px calc(10px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line)}
.play{height:66px;border-radius:18px;border:0;background:var(--play);color:#fff;font-size:22px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px}
.play.on{background:var(--stop)}
.tap{height:66px;border-radius:18px;border:1px solid var(--line);background:var(--panel2);font-size:18px;font-weight:800}
.tap.small{font-size:15px}
.tap.hit{background:var(--beat);color:#111}
@media(min-width:760px){.dock{max-width:760px;margin:0 auto;border-radius:18px 18px 0 0;border-left:1px solid var(--line);border-right:1px solid var(--line)}}
/* flash */
#flash{position:fixed;inset:0;pointer-events:none;z-index:4;opacity:0;transition:opacity .12s}
#flash.f3{background:var(--acc);opacity:.35;transition:none}#flash.f2{background:var(--beat);opacity:.18;transition:none}
/* modal */
.modal{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.modal[hidden]{display:none}
.sheet{background:var(--panel);width:100%;max-width:760px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px 14px calc(20px + env(safe-area-inset-bottom));border:1px solid var(--line)}
.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:18px}
.plist{display:flex;flex-direction:column;gap:8px}
.pitem{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px;background:var(--panel2)}
.pitem .pact{display:flex;gap:4px}.pitem .pact button{min-height:40px;padding:0 10px;border-radius:9px;border:1px solid var(--line);background:var(--panel)}
.pitem .pact .primary{background:var(--beat);color:#111;border-color:var(--beat);font-weight:700}
.pitem .pinfo{grid-column:1/-1;font-size:12px;color:var(--muted)}
.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px}
.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--muted)}
table.log{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
table.log td,table.log th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left}
table.log th{color:var(--muted);font-weight:400}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom));z-index:12;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;max-width:90vw;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.4)}
.danger{color:var(--bad)!important;border-color:color-mix(in srgb,var(--bad) 50%,transparent)!important}

</style>
</head>
<body>
<div id="flash" aria-hidden="true"></div>

<header class="top">
  <div class="brand"><span class="logo">♩</span> 節拍器 <small id="ver"></small></div>
  <div class="topbtns">
    <span id="offline" class="badge" title="離線狀態">…</span>
    <button class="ghost" id="btnPresets" aria-label="預設">預設</button>
    <button class="ghost" id="btnStats" aria-label="紀錄">紀錄</button>
  </div>
</header>

<main>
  <!-- 舞台：狀態 + 視覺 -->
  <section class="stage card">
    <div class="status">
      <span><b id="stMeter">4/4</b> <span id="stGroups" class="muted"></span></span>
      <span>小節 <b id="stBar">–</b></span>
      <span>拍 <b id="stBeat">–</b></span>
    </div>
    <div id="modeLabel" class="modelabel"></div>
    <div class="vistabs" role="tablist">
      <button data-vis="lights" role="tab">燈號</button>
      <button data-vis="grid" role="tab">格線</button>
      <button data-vis="anim" role="tab">動畫</button>
    </div>
    <div id="vis" class="vis"></div>
    <div id="visHint" class="hint"></div>
  </section>

  <!-- 速度 -->
  <section class="tempo card">
    <div class="bpmrow">
      <button class="bpmbtn" data-d="-5">−5</button>
      <button class="bpmbtn" data-d="-1">−1</button>
      <div class="bpmbox">
        <input id="bpm" type="number" inputmode="numeric" min="20" max="300" value="100" aria-label="BPM">
        <div class="bpmunit"><span id="basisNote">♩</span> = BPM · <span id="tempoName">Andante</span></div>
      </div>
      <button class="bpmbtn" data-d="1">+1</button>
      <button class="bpmbtn" data-d="5">+5</button>
    </div>
    <input id="bpmSlider" type="range" min="20" max="300" step="1" value="100" aria-label="BPM 滑桿">
    <div id="bpmNote" class="hint"></div>
  </section>

  <!-- 拍號 -->
  <details class="card" open id="secMeter">
    <summary>拍號及分組 <span class="sumval" id="sumMeter"></span></summary>
    <div class="lbl">常用拍號</div>
    <div class="chips" id="meterChips"></div>
    <div class="lbl">Odd Time / 複合拍</div>
    <div class="chips" id="meterChips2"></div>
    <div class="row">
      <label>自訂拍號
        <span class="inline"><input id="numIn" type="number" min="1" max="32" value="4"> / <select id="denIn"><option>2</option><option>4</option><option>8</option><option>16</option></select></span>
      </label>
      <label>分組（例：2+2+3）<input id="groupIn" type="text" inputmode="numeric" placeholder="2+2+3"></label>
    </div>
    <div class="lbl">分組預設</div>
    <div class="chips" id="groupChips"></div>
    <div id="compoundBox"></div>
  </details>

  <!-- 細分 -->
  <details class="card" open id="secSub">
    <summary>節奏細分 <span class="sumval" id="sumSub"></span></summary>
    <div class="chips" id="subChips"></div>
    <div id="subExtra"></div>
    <div class="lbl">細分格（點擊開關個別位置；第一格是拍點，由重拍設定控制）</div>
    <div id="maskEditor" class="maskrow"></div>
  </details>

  <!-- 重拍 -->
  <details class="card" open id="secAccent">
    <summary>重拍（Accent） <span class="sumval" id="sumAccent"></span></summary>
    <div class="legend"><span class="lv lv3">重</span>重拍 <span class="lv lv2">普</span>普通 <span class="lv lv1">輕</span>輕拍 <span class="lv lv0">×</span>靜音 — 點擊每拍循環切換</div>
    <div id="accentRow" class="accentrow"></div>
    <div class="chips">
      <button class="chip" data-acc="groups">分組預設</button>
      <button class="chip" data-acc="first">只有第一拍</button>
      <button class="chip" data-acc="none">全部普通</button>
      <button class="chip" data-acc="all">全部重拍</button>
      <button class="chip" data-acc="mainOnly">只響組首</button>
    </div>
    <div class="row">
      <label>保存目前重拍模式<span class="inline"><input id="accName" type="text" placeholder="名稱，例如：Backbeat"><button class="chip" id="accSave">保存</button></span></label>
    </div>
    <div id="accSaved" class="chips"></div>
  </details>

  <!-- 音色 -->
  <details class="card" id="secSound">
    <summary>音色及音量 <span class="sumval" id="sumSound"></span></summary>
    <div class="seg" id="soundMode">
      <button data-sm="click">節拍音</button>
      <button data-sm="drum">鼓聲模式</button>
    </div>
    <div id="soundSets" class="chips"></div>
    <div id="roleSel"></div>
    <div class="lbl">音量</div>
    <div id="volBox"></div>
  </details>

  <!-- 練習模式 -->
  <details class="card" id="secMode">
    <summary>練習模式 <span class="sumval" id="sumMode"></span></summary>
    <select id="modeSel" class="big"></select>
    <p id="modeDesc" class="hint"></p>
    <div id="modeCfg"></div>
  </details>

  <!-- 預備拍及計時 -->
  <details class="card" id="secTimer">
    <summary>預備拍及練習計時 <span class="sumval" id="sumTimer"></span></summary>
    <div class="lbl">Count-in（預備拍）</div>
    <div class="chips" id="ciChips"></div>
    <div class="lbl">練習計時（時間到自動停止並提示）</div>

<script>

    { id: 'e', span: 1, count: 2 },
    { id: 'trip8', span: 1, count: 3 },
    { id: 's', span: 1, count: 4 },
    { id: 'trip16', span: 1, count: 6 },
    { id: 't32', span: 1, count: 8 },
    { id: 'tripq', span: 2, count: 3 },

    { id: 'dot8', span: 3, count: 4 },

    { id: 'custom', span: 1, count: 0 }

    { id: 'standard', name: '標準節拍器' },
    { id: 'gap', name: '靜音小節（Gap Training）' },
    { id: 'ramp', name: '漸進速度（Tempo Ramp）' },
    { id: 'ladder', name: '速度階梯（Tempo Ladder）' },
    { id: 'random', name: '隨機重拍（Random Accent）' },
    { id: 'subtrain', name: '細分訓練（Subdivision Training）' },

  }

  /* 練習模式導演：決定每一小節的速度、拍號、是否發聲等 */
  function createDirector(S, seed) {

      if (changedLocal) writeLocal('stats', merged, Math.max(localT, d.t));
    } else if (first) {
      // 這部裝置第一次同步：以雲端為準，再補回本機獨有的項目
      if (key === 'state') { writeLocal('state', val, d.t); applyRemoteState(val); }
      else if (key === 'presets') { var mp = mergeByName(val, local, function (p) { return p.name; }); writeLocal('presets', mp, d.t); needPush = mp.length !== val.length; changedLocal = true; }
      else if (key === 'acc') { var ma = mergeByName(val, local, function (p) { return p.name + '|' + p.meter; }); writeLocal('acc', ma, d.t); needPush = ma.length !== val.length; changedLocal = true; }
    } else if (d.t > localT) {
      if (key === 'state') { writeLocal('state', val, d.t); applyRemoteState(val); }
      else { writeLocal(key, val, d.t); changedLocal = true; }
      if (Sync.ready[key] && d.dev !== Sync.dev) toast('已從其他裝置同步');
    } else if (d.t < localT) needPush = true;
    if (first) LS.raw('metro.v1.synced.' + key, 'true');
    Sync.ready[key] = true;
    if (changedLocal) refreshLists(key);
    if (needPush) { if (needPush && key !== 'stats') Sync.meta[key] = Date.now(), saveMeta(); pushKey(key); } else setSync('ok');
  }
  function startSync() {
    if (!window.claude || !window.claude.use || BRIDGE || location.protocol === 'file:') return;
    setSync('connecting');
    var to = setTimeout(function () { if (Sync.status === 'connecting') setSync('err'); }, 10000);
    Promise.all([window.claude.use('db'), window.claude.use('user')]).then(function (r) {
      var db = r[0], user = r[1];
      if (!db || !user) { clearTimeout(to); setSync('off'); return null; }
      return user.id().then(function (uid) {
        if (!uid) { clearTimeout(to); setSync('off'); return; }
        Sync.db = db; Sync.uid = uid; Sync.on = true;
        ['state', 'presets', 'acc', 'stats'].forEach(function (k) {
          Sync.last[k] = (function () { try { return localStorage.getItem(SYNC_LS[k]); } catch (e) { return null; } })();
          Sync.refs[k] = db.doc('data/users/' + uid + '/' + k);
          Sync.refs[k].onSnapshot(function (snap) {
            if (!snap.metadata.fromCache) clearTimeout(to);
            onRemote(k, snap);
          }, function (e) { clearTimeout(to); setSync(e && e.code === 'revoked' ? 'off' : 'err'); });
        });
      });
    }, function () { clearTimeout(to); setSync('off'); });
  }

  /* ---------- Modal ---------- */
  function openModal(title, body) { $('#modalTitle').textContent = title; var b = $('#modalBody'); b.innerHTML = ''; b.appendChild(body); $('#modal').hidden = false; }
  function closeModal() { $('#modal').hidden = true; }

  /* ---------- 播放 UI ---------- */
  function updatePlayUI() {
    var p = isPlaying();
    $('#play').classList.toggle('on', p); $('#playIcon').textContent = p ? '■' : '▶'; $('#playTxt').textContent = p ? '停止' : '開始';
    if (!p) { showBpm(state.bpm); updateBpmNote(); $('#tap').textContent = 'TAP'; }
  }

  /* ---------- 離線狀態 ---------- */
  function badge(txt, cls, title) { var b = $('#offline'); b.textContent = txt; b.className = 'badge ' + (cls || ''); b.title = title || ''; }
  function setupOffline() {
    if (window.claude && window.claude.use && location.protocol !== 'file:') { syncBadge(); return; }
    if (BRIDGE) { badge('✓ 離線 App', 'ok', 'Android App：全部資源已在手機內，不需網絡'); return; }
    if (location.protocol === 'file:') { badge('本地檔案', 'ok', '直接開啟本地檔案：所有功能離線可用（不需安裝）'); return; }
    if (!('serviceWorker' in navigator) || !window.caches) { badge('不支援離線快取', 'warn', '此瀏覽器或頁面不允許 Service Worker'); return; }
    navigator.serviceWorker.register('sw.js').then(function () {
      var tries = 0;
      (function chk() {
        caches.keys().then(function (keys) {
          var k = keys.filter(function (x) { return x.indexOf(CACHE_PREFIX) === 0; })[0];
          if (!k) return null;
          return caches.open(k).then(function (c) { return c.match('index.html').then(function (r) { return r || c.match('./'); }); });
        }).then(function (r) {
          if (r) badge('✓ 可離線使用', 'ok', '程式及資源已快取，沒有網絡亦可開啟');
          else if (tries++ < 10) { badge('準備離線中…', 'warn'); setTimeout(chk, 1500); }
          else badge('未能快取', 'warn', '請保持網絡並重新載入一次');
        }).catch(function () { badge('離線狀態不明', 'warn'); });
      })();
    }).catch(function (e) { badge('預覽模式', 'warn', '此頁面未能啟用離線快取：' + e.message); });
  }

  /* ---------- 事件 ---------- */
  function bindEvents() {
    $('#play').addEventListener('click', toggle);
    $('#tap').addEventListener('click', tap);
    $('#quickMode').addEventListener('click', function () { var d = $('#secMode'); d.open = true; d.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
    $('#bpm').addEventListener('change', function (e) { setBpm(e.target.value); });
    $('#bpm').addEventListener('focus', function (e) { e.target.select(); });
    $('#bpm').addEventListener('keydown', function (e) { if (e.key === 'Enter') e.target.blur(); });
    $('#bpmSlider').addEventListener('input', function (e) { setBpm(e.target.value); });
    $$('.bpmbtn').forEach(function (b) {
      var d = +b.dataset.d, t1 = null, t2 = null;
      var end = function () { clearTimeout(t1); clearInterval(t2); };
      b.addEventListener('pointerdown', function (e) { e.preventDefault(); setBpm(state.bpm + d); t1 = setTimeout(function () { t2 = setInterval(function () { setBpm(state.bpm + d); }, 70); }, 420); });
      ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (ev) { b.addEventListener(ev, end); });
      b.addEventListener('click', function (e) { if (e.detail === 0) setBpm(state.bpm + d); }); // 鍵盤觸發
    });
    $$('.vistabs button').forEach(function (b) { b.addEventListener('click', function () { state.visMode = b.dataset.vis; save(); renderVis(); }); });
    $('#numIn').addEventListener('change', function (e) { setMeter(e.target.value, +$('#denIn').value); });
    $('#denIn').addEventListener('change', function (e) { setMeter($('#numIn').value, +e.target.value); });
    $('#groupIn').addEventListener('change', function (e) {
      var g = C.parseGroups(e.target.value, state.num);
      if (!g) { toast('分組總和必須等於 ' + state.num + '（例：' + C.defaultGroups(state.num, state.den).join('+') + '）'); e.target.value = state.groups.join('+'); return; }
      setGroups(g);
    });
    $$('[data-acc]').forEach(function (b) { b.addEventListener('click', function () {
      var m = b.dataset.acc;
      state.accents = m === 'all' ? state.accents.map(function () { return 3; }) : C.accentsFor(m, state.num, state.groups);
      save(); renderAccent(); renderVis(); renderMeter();
    }); });
    $('#accSave').addEventListener('click', function () {
      var n = $('#accName').value.trim(); if (!n) { toast('請輸入名稱'); return; }
      var s = LS.get(KEY.acc, []); s.push({ name: n, meter: state.num + '/' + state.den, groups: state.groups.slice(), accents: state.accents.slice() });
      LS.set(KEY.acc, s); $('#accName').value = ''; renderAccent(); toast('已保存重拍模式：' + n);
    });
    $$('#soundMode button').forEach(function (b) { b.addEventListener('click', function () { state.sounds.drumMode = b.dataset.sm === 'drum'; save(); renderSound(); preview((state.sounds.drumMode ? state.sounds.drum : state.sounds.click).A); }); });
    $('#modeSel').addEventListener('change', function (e) { state.mode = e.target.value; dirty(); renderMode(); });
    $('#btnPresets').addEventListener('click', openPresets);
    $('#btnStats').addEventListener('click', openStats);
    $('#modalClose').addEventListener('click', closeModal);
    $('#modal').addEventListener('click', function (e) { if (e.target.id === 'modal') closeModal(); });
    $('#secAdv').addEventListener('toggle', function () { if ($('#secAdv').open) renderAdv(); });
    document.addEventListener('keydown', function (e) {
      var tg = e.target, tag = (tg.tagName || '').toLowerCase();
      if (e.key === 'Escape') { if (!$('#modal').hidden) closeModal(); else if (tg.blur) tg.blur(); return; }
      if (tag === 'input' && tg.type !== 'range' && tg.type !== 'checkbox' || tag === 'select' || tag === 'textarea' || tg.isContentEditable) return;
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      var k = e.key;
      if (k === ' ' || e.code === 'Space') { e.preventDefault(); if (!e.repeat) toggle(); return; }
      if (k === 'ArrowUp') { e.preventDefault(); setBpm(state.bpm + 1); }
      else if (k === 'ArrowDown') { e.preventDefault(); setBpm(state.bpm - 1); }
      else if (k === 'ArrowRight') { e.preventDefault(); setBpm(state.bpm + 5); }
      else if (k === 'ArrowLeft') { e.preventDefault(); setBpm(state.bpm - 5); }
      else if (k === 't' || k === 'T') tap();
      else if (k === 'v' || k === 'V') { var vs = ['lights', 'grid', 'anim']; state.visMode = vs[(vs.indexOf(state.visMode) + 1) % 3]; save(); renderVis(); }
      else if (k === 'd' || k === 'D') { state.sounds.drumMode = !state.sounds.drumMode; save(); renderSound(); toast(state.sounds.drumMode ? '鼓聲模式：開' : '鼓聲模式：關'); }
      else if (/^[1-8]$/.test(k)) { state.mode = C.MODES[+k - 1].id; dirty(); renderMode(); toast('練習模式：' + modeName(state.mode)); }
    });
    // 防止 Space 在按鈕上 keyup 時再觸發 click
    document.addEventListener('keyup', function (e) { if ((e.key === ' ' || e.code === 'Space') && (e.target.tagName || '').toLowerCase() === 'button') e.preventDefault(); }, true);
  }

  function renderAll() { applyTheme(); applyRange(); renderMeter(); renderSub(); renderAccent(); renderSound(); renderMode(); renderTimer(); renderVis(); updatePlayUI(); if ($('#secAdv').open) renderAdv(); }

  /* ---------- 啟動 ---------- */
  function init() {
    if (!LS.get(KEY.init, false)) { LS.set(KEY.presets, builtinPresets()); LS.set(KEY.init, true); }
    $('#ver').textContent = 'V' + APP_VERSION; $('#footVer').textContent = 'V' + APP_VERSION;
    bindEvents(); renderAll(); setupOffline(); startSync();
    requestAnimationFrame(frame);
    window.__metronome = { state: function () { return state; }, sch: sch, A: A, Vis: Vis, start: start, stop: stop, setBpm: setBpm, setMeter: setMeter };
  }
  init();
})();

</script>
</body>
